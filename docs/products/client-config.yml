# 客户端配置教程（极简版：单 platform_tabs + 3 tab，每个 tab 嵌视频 + 步骤，步骤内嵌字段/代码/截图）
# 架构对照：
#   screenshot 截图 2 → 单卡 + 顶部 3 tab + 视频 + 编号步骤（含 API Key 复制按钮）
#   tab.sections   → 按段类型递归渲染（platform_tabs 的 tab 支持嵌套任意段类型）
#   step.fields    → 步骤内嵌字段列表；step.fields[i].copyable = true 时带「复制」按钮
#   __USER_KEY__   → 前端异步注入登录用户默认 Key（复制按钮读 DOM 文本，能取到替换后的真实 Key）
title: "客户端配置教程"
summary: "按你的系统选择，一键完成 WorkBuddy 客户端模型配置"
icon: "key"
order: 10
draft: false
sections:
  # 用 bare: true 跳过 platform_tabs 外层 .card，整体只一层 card 包裹由 renderDocProduct 提供
  - type: platform_tabs
    bare: true
    title: "配置教程"
    tabs:
      - name: "macOS 一键配置"
        sections:
          - type: video
            src: "/static/videos/mac-setup.mp4"
            poster: "/static/images/poster.jpg"
            title: "macOS 配置教程"
          - type: steps
            title: ""
            items:
              - name: "运行配置命令"
                body: "打开「终端」应用程序，粘贴下面这段命令并回车执行。脚本已内置到项目 static/setup/ 目录，本地开发也可直接 bash static/setup/workbuddy-mac.sh 运行："
                code: "curl -fsSL https://workbuddy.oneworker.cn/setup/workbuddy-mac.sh | bash"
                lang: bash
              - name: "粘贴 API Key"
                body: "复制下面的 API Key，脚本运行时会提示你粘贴："
                fields:
                  - label: "API Key"
                    value: "__USER_KEY__"
                    copyable: true
              - name: "开始使用"
                body: "安装完成后打开 WorkBuddy，新建任务，在对话框右下角选择自定义模型，即可开始对话。"
                image: "/static/images/workbuddy-select-model.png"
      - name: "Windows 一键配置"
        sections:
          - type: video
            src: "/static/videos/win-setup.mp4"
            poster: "/static/images/poster.jpg"
            title: "Windows 配置教程"
          - type: steps
            title: ""
            items:
              - name: "下载配置工具"
                body: "[**下载 workbuddy-windows.cmd**](https://workbuddy.oneworker.cn/setup/workbuddy-windows.cmd)"
              - name: "运行并粘贴 Key"
                body: "双击运行保存的 `workbuddy-windows.cmd`，按提示粘贴下面这段 Key："
                fields:
                  - label: "API Key"
                    value: "__USER_KEY__"
                    copyable: true
              - name: "开始使用"
                body: "脚本完成后打开 WorkBuddy，新建任务，在对话框右下角选择自定义模型，开始对话。"
                image: "/static/images/workbuddy-select-model.png"
      - name: "手动配置"
        sections:
          - type: steps
            title: ""
            items:
              - name: "打开 WorkBuddy 模型设置"
                body: "进入「设置 → 模型 / 自定义模型」。"
                image: "/static/images/workbuddy-manual-1-open.png"
              - name: "添加模型"
                body: "点击「添加模型」，提供商选择「其他（自定义 / Custom）」。"
                image: "/static/images/workbuddy-manual-2-provider.png"
              - name: "填入配置并保存"
                body: "把下面 3 项信息填到对应字段后保存："
                fields:
                  - label: "接口地址"
                    value: "https://api.aihuobao.cn/v1"
                  - label: "API Key"
                    value: "__USER_KEY__"
                    copyable: true
                  - label: "模型名称"
                    value: "auto"
                image: "/static/images/workbuddy-manual-3-fill.png"
