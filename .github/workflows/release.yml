name: Release

# 发布触发：打 v* tag（正式版本）或 push 主干（开发版本）。
#
# 两条通道刻意区别对待，见下方「生成镜像标签」步骤：
#   tag 推送   -> 语义化版本 + latest，供生产部署引用
#   分支推送   -> 只打分支名与 sha（如 dev-<sha7>），不动 latest
# 若分支推送也移动 latest，生产环境 `docker pull latest` 会拉到未经发布决策的
# 代码，且无法回滚到「上一个正式版本」——latest 必须只由 tag 移动。
# dev 入列：产出 dev-<sha7> 测试镜像供测试环境拉取，latest 仍只由 tag 移动。
on:
  push:
    branches: [master, main, dev]
    tags: ["v*"]
  # 允许在 Actions 页面手动发起，无需命令行打 tag
  workflow_dispatch:

# 主干连续推送时取消旧运行（避免两次构建竞争同一 sha 标签）；
# tag 发布不可取消 —— 中途掐掉会留下推了一半的多架构清单。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read
  packages: write   # 推 GHCR 所需

jobs:
  publish:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # 发布前重跑门禁：tag 可能打在未过 CI 的提交上
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: Ruff 静态检查
        run: ruff check app tests

      - name: 单元测试
        env:
          BFF_MOCK_MODE: "1"
          BFF_SECRET_KEY: ci-only-secret-not-for-production
        run: pytest -q

      # 发布门禁不该比 PR 门禁弱：tag 可能打在未过 CI 的提交上
      - name: 业务 E2E 回归（mock 模式）
        env:
          BFF_MOCK_MODE: "1"
          BFF_SECRET_KEY: ci-only-secret-not-for-production
          BFF_BASE_URL: http://127.0.0.1:8301
          # E2E 走明文 http，Secure Cookie 不会被 httpx 回传，登录态会整段丢失。
          # 仅本步骤关闭，不影响生产镜像的 COOKIE_SECURE=1。
          BFF_COOKIE_SECURE: "0"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8301 > /tmp/bff-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8301/healthz > /dev/null 2>&1 && break
            if [ "$i" = "30" ]; then
              echo "::error::mock 服务 30 秒内未就绪"
              cat /tmp/bff-e2e.log
              exit 1
            fi
            sleep 1
          done
          python scripts/e2e_redeem_mock.py

      - name: emoji 门禁（P0-1 硬规则）
        run: python scripts/check_no_emoji.py

      - uses: docker/setup-buildx-action@v3

      # 用仓库自带的 GITHUB_TOKEN，无需额外配置密钥
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本号统一在这里算一次，供 build-arg 与冒烟校验共用。
      # 不直接用 github.ref_name：主干推送时它是「master」，写进镜像标签后
      # 线上 /healthz 只会显示 master，无法回溯到具体提交。
      - name: 计算版本号
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
          else
            # 取 sha 前 7 位，与 metadata-action 的 sha-<short> 标签保持一致，
            # 便于从 /healthz 的版本号直接反查镜像标签
            short="${{ github.sha }}"
            v="${{ github.ref_name }}-${short:0:7}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "本次发布版本号：$v"

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # semver 系列只在 tag 事件生效，branch 事件自动跳过（action 内建行为）。
          # latest 用 enable 显式限定为 tag 事件 —— 默认规则会把主干推送也算作
          # latest，那会让生产 pull latest 拿到未发布的代码。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # 先 load 到本地做冒烟，通过后才 push —— 避免把起不来的镜像推出去
      - name: 构建镜像（本地）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: newapi-bff:candidate
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        run: |
          docker run -d --name bff-rc \
            -e BFF_MOCK_MODE=1 \
            -e BFF_SECRET_KEY="$(openssl rand -hex 32)" \
            -p 8000:8000 \
            newapi-bff:candidate

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/readyz > /tmp/r.json 2>/dev/null && break
            if [ "$i" = "30" ]; then
              echo "::error::候选镜像 30 秒内未就绪，中止发布"
              docker logs bff-rc
              exit 1
            fi
            sleep 1
          done
          echo "候选镜像就绪：$(cat /tmp/r.json)"

          # 版本号必须被正确注入，否则线上无法回溯跑的是哪个版本。
          # 比对用 steps.ver 而非 github.ref_name：主干推送时后者是「master」，
          # 而镜像里注入的是「master-<sha>」，用 ref_name 比对会漏掉 sha 丢失的情况。
          got=$(curl -fsS http://127.0.0.1:8000/healthz | grep -o '"version":"[^"]*"')
          echo "$got" | grep -q "${{ steps.ver.outputs.value }}" \
            || { echo "::error::镜像版本号未正确注入：$got"; exit 1; }

          docker rm -f bff-rc > /dev/null

      - name: 推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha

      - name: 输出发布结果
        run: |
          echo "### 镜像已发布" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
